name: Build & Release Alfraganus Standalone Executable

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Alfraganus.exe on Windows
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Download MediaPipe Landmarker Model
        run: |
          New-Item -ItemType Directory -Force -Path gestures
          Invoke-WebRequest -Uri "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" -OutFile "gestures/hand_landmarker.task"

      - name: Compile Standalone Alfraganus.exe
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "Alfraganus" `
            --add-data "core;core" `
            --add-data "config;config" `
            --add-data "server;server" `
            --add-data "gestures;gestures" `
            --add-data "actions;actions" `
            --hidden-import "google.genai" `
            --hidden-import "fastapi" `
            --hidden-import "uvicorn" `
            --hidden-import "websockets" `
            --hidden-import "sounddevice" `
            --hidden-import "mediapipe" `
            --hidden-import "pyautogui" `
            --hidden-import "psutil" `
            main.py

      - name: Compress Build Artifacts
        run: |
          Compress-Archive -Path dist/Alfraganus -DestinationPath dist/Alfraganus-Windows-x64.zip

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Alfraganus-Windows-x64
          path: dist/Alfraganus-Windows-x64.zip

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/Alfraganus-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
